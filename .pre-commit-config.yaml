exclude: |
    (?x)^(
        codegen/kwd.json|
        codegen/additional-cards.json|
        benchmarks/.*|
        doc/source/.*|
        tests/.*|
        src/ansys/dyna/core/keywords/keyword_classes/auto/|
        src/ansys/dyna/core/keywords/keyword_classes/type_mapping.py|
        src/ansys/dyna/core/keywords/keyword_classes/auto_keywords.py|
        src/ansys/dyna/core/keywords/keyword_classes/manual/.*_version_.*\.py|
        .*\.k$
    )
repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt", "-w"]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml

# this validates our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows

- repo: https://github.com/ansys/pre-commit-hooks
  rev: dbcd0a4ad0060f78ac3c7d53d342f510edc48eab  # frozen: v0.8.1
  hooks:
    - id: add-license-headers
      files: '(src|tests|doc|codegen)/.*\.(py)'
      args:
      - --start_year=2023

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
  hooks:
    - id: zizmor
      args: ["--pedantic"]